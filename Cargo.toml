[package]
name = "folder_sync"
version = "1.0.6"
edition = "2021"

[dependencies]
slint = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
chrono = "0.4"
rfd = "0.15"
ureq = { version = "2", features = ["json"] }
self-replace = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1"
