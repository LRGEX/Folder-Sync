[package]
name = "folder_sync"
version = "1.2.27"
edition = "2021"

[[bin]]
name = "LRGEXSync"
path = "src/main.rs"

[dependencies]
slint = { version = "1.10", features = ["backend-winit", "renderer-software"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }
chrono = "0.4"
rfd = "0.15"
ureq = { version = "2", features = ["json"] }
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true

[build-dependencies]
winres = "0.1"

[[bin]]
name = "keygen"
path = "src/keygen.rs"

[[bin]]
name = "sign"
path = "src/sign.rs"
